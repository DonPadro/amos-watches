services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SITE_URL: https://${DOMAIN}
    volumes:
      - amos_data:/app/data
      - amos_uploads:/app/uploads
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  amos_data:
  amos_uploads:
  caddy_data:
  caddy_config:
